<div class="table-container"> <table *ngIf="!isLoading; else loadingTemplate">
    <thead>
      <tr>
        <th style="width: 25%;">Fecha</th>
        
        <th style="width: 20%; text-align: center;">Insumos</th>
        
        <th style="text-align: right; width: 25%;">Total</th>
        
        <th class="actions-col">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of pedidos">
        
        <td style="font-weight: 500; color: #eee;">
           {{ p.fecha | date:'dd MMM yyyy' }}
        </td>

        <td style="text-align: center;">
            <span class="badge-count">
              {{ p.cantidad_items }} Arts.
            </span>
        </td>

        <td style="text-align: right; font-weight: bold; color: #4CAF50;">
          ${{ p.total | number:'1.2-2' }}
        </td>

        <td class="actions-cell">
    
            <button class="btn-icon view" title="Ver Detalle" (click)="onView(p)">
                Ver
            </button>

            <button class="btn-icon edit" (click)="onEdit(p)">Editar</button>

            <button class="btn-icon delete" (click)="onDelete(p)">Eliminar</button>

        </td>
      </tr>

      <tr *ngIf="pedidos.length === 0">
        <td colspan="4" class="no-data"> {{ sucursalId ? 'No hay pedidos registrados.' : 'Selecciona una sucursal.' }}
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #loadingTemplate>
    <div class="loading-state"> <div class="spinner"></div> <p>Cargando historial...</p>
    </div>
  </ng-template>

</div>
