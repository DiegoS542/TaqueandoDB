<header class="navbar-container">
  
  <div class="navbar-left">
    <div class="logo-wrapper">
      <img src="logo.png" alt="Logo Taqueando" class="navbar-logo">
    </div>
    <span class="navbar-title">Sistema de Gestión</span>
  </div>

  <div class="navbar-right">
    
    <span *ngIf="usuario" class="navbar-username">
      {{ usuario.nombre }}
    </span>

    <button (click)="logout()" class="logout-button">
      Cerrar Sesión
    </button>
  </div>

</header>
